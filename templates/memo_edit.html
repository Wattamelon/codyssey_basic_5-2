<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메모 수정</title>
</head>
<body>
    <h1>메모 수정</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/memos/{{ memo['id'] }}/edit">
        <p>
            <label for="title">제목</label>
            <input type="text" id="title" name="title" maxlength="100" value="{{ memo['title'] }}" required>
        </p>
        <p>
            <label for="content">내용</label>
            <textarea id="content" name="content" rows="5" required>{{ memo['content'] }}</textarea>
        </p>
        <button type="submit">수정 저장</button>
        <a href="/memos">취소</a>
    </form>
</body>
</html>
