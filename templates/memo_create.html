<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>새 메모 작성</title>
</head>
<body>
    <h1>새 메모 작성</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/memos">
        <p>
            <label for="title">제목</label>
            <input type="text" id="title" name="title" maxlength="100" value="{{ title | default('') }}" required>
        </p>
        <p>
            <label for="content">내용</label>
            <textarea id="content" name="content" rows="5" required>{{ content | default('') }}</textarea>
        </p>
        <button type="submit">저장</button>
        <a href="/memos">취소</a>
    </form>
</body>
</html>
